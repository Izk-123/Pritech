{% extends "base.html" %}

{% block title %}{% if form.instance.pk %}Edit Role{% else %}New Role{% endif %}{% endblock %}
{% block page_title %}{% if form.instance.pk %}Edit Role{% else %}Create Role{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'role_list' %}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
