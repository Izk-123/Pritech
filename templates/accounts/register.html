{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Register — Pritech</title>
  <link href="{% static 'img/favicon.ico' %}" rel="icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/mobile-first.css' %}">
  <style>
    body { background: var(--bg-secondary); }
    .register-card { max-width: 550px; border-radius: 20px; }
    .password-wrapper {
      position: relative;
    }
    .password-wrapper input {
      padding-right: 40px;
    }
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--text-muted);
      background: transparent;
      border: none;
      z-index: 10;
    }
    .password-match-feedback {
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }
    .password-match-feedback.valid {
      color: var(--success);
    }
    .password-match-feedback.invalid {
      color: var(--danger);
    }
    .password-strength {
      margin-top: 0.25rem;
      font-size: 0.75rem;
    }
  </style>
</head>
<body class="d-flex align-items-center min-vh-100 p-3">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-7">
      <div class="card register-card shadow-lg border-0">
        <div class="card-body p-4 p-md-5">
          <div class="d-flex justify-content-end mb-2">
            <button class="theme-toggle-btn" id="themeToggle" type="button">
              <i class="bi bi-sun-fill light-icon"></i>
              <i class="bi bi-moon-stars-fill dark-icon"></i>
            </button>
          </div>
          <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px;">
              <span class="fw-bold fs-5">PT</span>
            </div>
            <h2 class="fw-bold" style="color: var(--text-primary);">Create account</h2>
            <p style="color: var(--text-muted);">Client registration</p>
          </div>
          {% if form.non_field_errors %}
            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
          {% endif %}
          <form method="post" id="registerForm" novalidate>
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label fw-semibold" style="color: var(--text-primary);">Company name</label>
                <input type="text" name="company_name" class="form-control" required>
              </div>
              <div class="col-sm-6">
                <label class="form-label fw-semibold" style="color: var(--text-primary);">First name</label>
                <input type="text" name="first_name" class="form-control" required>
              </div>
              <div class="col-sm-6">
                <label class="form-label fw-semibold" style="color: var(--text-primary);">Last name</label>
                <input type="text" name="last_name" class="form-control" required>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold" style="color: var(--text-primary);">Email</label>
                <input type="email" name="email" class="form-control" required>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold" style="color: var(--text-primary);">Phone</label>
                <input type="text" name="phone_number" class="form-control" placeholder="+265 999 000 000">
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold" style="color: var(--text-primary);">Address</label>
                <textarea name="physical_address" class="form-control" rows="2"></textarea>
              </div>
              <div class="col-sm-6">
                <label class="form-label fw-semibold" style="color: var(--text-primary);">Password</label>
                <div class="password-wrapper">
                  <input type="password" name="password" id="password" class="form-control" required>
                  <button type="button" class="password-toggle" id="togglePassword">
                    <i class="bi bi-eye-slash"></i>
                  </button>
                </div>
                <div class="password-strength" id="passwordStrength"></div>
              </div>
              <div class="col-sm-6">
                <label class="form-label fw-semibold" style="color: var(--text-primary);">Confirm password</label>
                <div class="password-wrapper">
                  <input type="password" name="confirm_password" id="confirm_password" class="form-control" required>
                  <button type="button" class="password-toggle" id="toggleConfirmPassword">
                    <i class="bi bi-eye-slash"></i>
                  </button>
                </div>
                <div class="password-match-feedback" id="passwordMatchFeedback"></div>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 mt-4 fw-semibold">Create account</button>
          </form>
          <p class="text-center mt-4 mb-0" style="color: var(--text-muted);">
            Have an account? <a href="{% url 'login' %}" class="fw-semibold" style="color: var(--primary);">Sign in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  (function() {
    // Theme toggle
    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    function setTheme(theme) {
      html.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      const lightIcon = document.querySelector('.light-icon');
      const darkIcon = document.querySelector('.dark-icon');
      if (theme === 'dark') {
        lightIcon.style.display = 'none';
        darkIcon.style.display = 'inline-block';
      } else {
        lightIcon.style.display = 'inline-block';
        darkIcon.style.display = 'none';
      }
    }
    const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    setTheme(savedTheme);
    themeToggle?.addEventListener('click', () => setTheme(html.getAttribute('data-theme') === 'light' ? 'dark' : 'light'));

    // Password visibility toggles
    const togglePassword = document.getElementById('togglePassword');
    const passwordField = document.getElementById('password');
    togglePassword?.addEventListener('click', function() {
      const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordField.setAttribute('type', type);
      this.querySelector('i').classList.toggle('bi-eye');
      this.querySelector('i').classList.toggle('bi-eye-slash');
    });

    const toggleConfirm = document.getElementById('toggleConfirmPassword');
    const confirmField = document.getElementById('confirm_password');
    toggleConfirm?.addEventListener('click', function() {
      const type = confirmField.getAttribute('type') === 'password' ? 'text' : 'password';
      confirmField.setAttribute('type', type);
      this.querySelector('i').classList.toggle('bi-eye');
      this.querySelector('i').classList.toggle('bi-eye-slash');
    });

    // Real‑time password match validation
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirm_password');
    const feedback = document.getElementById('passwordMatchFeedback');

    function validatePasswordMatch() {
      if (password.value === '' && confirm.value === '') {
        feedback.textContent = '';
        feedback.className = 'password-match-feedback';
        return;
      }
      if (password.value === confirm.value) {
        feedback.textContent = '✓ Passwords match';
        feedback.className = 'password-match-feedback valid';
      } else {
        feedback.textContent = '✗ Passwords do not match';
        feedback.className = 'password-match-feedback invalid';
      }
    }

    password?.addEventListener('input', validatePasswordMatch);
    confirm?.addEventListener('input', validatePasswordMatch);

    // Optional: simple password strength indicator (basic)
    const strengthDiv = document.getElementById('passwordStrength');
    function checkStrength() {
      const val = password.value;
      if (!val) {
        strengthDiv.textContent = '';
        return;
      }
      let strength = 'Weak';
      if (val.length >= 8 && /[A-Z]/.test(val) && /[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) {
        strength = 'Strong';
      } else if (val.length >= 6 && (/[A-Z]/.test(val) || /[0-9]/.test(val))) {
        strength = 'Medium';
      }
      strengthDiv.textContent = `Password strength: ${strength}`;
      strengthDiv.style.color = strength === 'Strong' ? 'var(--success)' : (strength === 'Medium' ? 'var(--warning)' : 'var(--danger)');
    }
    password?.addEventListener('input', checkStrength);
  })();
</script>
</body>
</html>
