{% extends "base.html" %}

{% block title %}Delete User{% endblock %}
{% block page_title %}Delete User{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body text-center">
        <i class="bi bi-exclamation-triangle-fill text-warning display-1"></i>
        <h4 class="mt-3">Are you sure?</h4>
        <p>You are about to delete user <strong>{{ user.email }}</strong>.</p>
        <p class="text-muted">This action cannot be undone.</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2 justify-content-center mt-3">
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{% url 'user_list' %}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
